# Apache vhost for the Telemedicine application.
#
# ${PORT} is substituted by docker/entrypoint.sh at container start, because
# Railway assigns the port per deployment.

<VirtualHost *:${PORT}>
    # The security-critical line. Serving /var/www/html instead of
    # /var/www/html/public would expose .env, storage/ (medical files and logs),
    # vendor/ and the whole application tree over HTTP.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # FollowSymLinks is required for mod_rewrite. Indexes is deliberately
        # absent so a directory without an index file returns 403 rather than a
        # browsable listing.
        Options -Indexes +FollowSymLinks

        # public/.htaccess ships with the application and holds Laravel's front
        # controller rewrite; AllowOverride All is what lets it take effect.
        AllowOverride All
        Require all granted
    </Directory>

    # Nothing outside public/ is served, but deny it explicitly as well: a
    # future misconfiguration of DocumentRoot should not silently become a
    # disclosure of the application source and its secrets.
    <Directory /var/www/html>
        Require all denied
    </Directory>

    # Railway terminates TLS at its edge and forwards plain HTTP, so Apache
    # cannot set HTTPS itself; Laravel derives the real scheme from
    # X-Forwarded-Proto via the trusted-proxy configuration in bootstrap/app.php.
    # These headers do not depend on that and are safe to set unconditionally.
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
    </IfModule>

    # Logs go to the container's stdout/stderr so Railway captures them; the
    # filesystem is ephemeral and a log file there would be lost on restart.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
